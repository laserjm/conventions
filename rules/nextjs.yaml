# Generated from the rule tables in docs/nextjs/**.md by scripts/build-catalog.py — do not edit by hand.
profile: nextjs
version: 0.1.0
rules:
  - id: NX-STR-01
    severity: error
    enforcement: "review"
    doc: docs/nextjs/architecture.md#structure
    rule: "All paths are relative to the app root aliased `@/`. Whether the app root is `src/` is a project choice recorded in `ARCHITECTURE.md`."
  - id: NX-STR-02
    severity: error
    enforcement: "eslint:check-file"
    doc: docs/nextjs/architecture.md#structure
    rule: "Each feature lives in `modules/<x>/`. Layer folders are `domain/`, `application/`, `infra/`; ui-layer files are `actions.ts`, `queries.ts`, `components/`; plus `commands.ts` (optional), `contracts.ts`, `index.ts`, `server.ts`. No other names; a test file sits next to the file it tests."
  - id: NX-STR-03
    severity: error
    enforcement: "eslint:boundaries"
    doc: docs/nextjs/architecture.md#structure
    rule: "`app/` contains routes only: pages, layouts, route handlers and route-local `_components/`."
  - id: NX-STR-04
    severity: warn
    enforcement: "review"
    doc: docs/nextjs/architecture.md#structure
    rule: "UI used by exactly one route lives in `app/.../_components/`; UI reused across routes or needing the module's types lives in `modules/<x>/components/`; design-system primitives live in `components/ui/` and are never feature-aware. Start in `_components/`; move when a second route needs it."
  - id: NX-STR-05
    severity: error
    enforcement: "eslint:boundaries"
    doc: docs/nextjs/architecture.md#structure
    rule: "`lib/` is cross-cutting and imports nothing from `modules/`."
  - id: NX-STR-06
    severity: error
    enforcement: "eslint:config"
    doc: docs/nextjs/architecture.md#structure
    rule: "Test infrastructure lives in `tests/{browser,support,factories}/`. Test files (`*.test.ts`, `*.spec.ts`, `__fakes__/`) are exempt from layer rules."
  - id: NX-LAYER-01
    severity: error
    enforcement: "eslint:boundaries/element-types"
    doc: docs/nextjs/architecture.md#layer-rules
    rule: "Imports follow the table above. `domain/` imports nothing outside its module except `lib/result` and `lib/errors`."
  - id: NX-LAYER-02
    severity: error
    enforcement: "eslint:boundaries/external"
    doc: docs/nextjs/architecture.md#layer-rules
    rule: "`domain/` and `application/` import no framework or vendor package (`react`, `next/*`, the ORM, the contract-schema library at runtime). Type-only imports from `contracts.ts` are allowed in `application/`."
  - id: NX-LAYER-03
    severity: error
    enforcement: "eslint:boundaries"
    doc: docs/nextjs/architecture.md#layer-rules
    rule: "Only `infra/` and `lib/db` import the ORM and `lib/db`."
  - id: NX-LAYER-04
    severity: error
    enforcement: "eslint:boundaries/element-types"
    doc: docs/nextjs/architecture.md#layer-rules
    rule: "Another module is reached only through its `index.ts` or `server.ts`. Never import another module's `domain/`, `application/`, `infra/`, `contracts.ts` or ui files."
  - id: NX-LAYER-05
    severity: error
    enforcement: "eslint:nextjs/no-server-exports-from-index"
    doc: docs/nextjs/architecture.md#layer-rules
    rule: "`index.ts` is safe to import from a client component: it never re-exports `infra/`, `queries.ts` or `commands.ts`. Server-only reads and commands are exported from `server.ts`; `server.ts`, `queries.ts` and `commands.ts` are marked `server-only`. Every module has both files; `server.ts` may be empty."
  - id: NX-LAYER-06
    severity: error
    enforcement: "review"
    doc: docs/nextjs/architecture.md#layer-rules
    rule: "Skipping the application layer: an action or query may call a repository directly when it needs no orchestration — a plain read, a single write with validation only, no business decision. The moment it needs a transaction, a domain function, a second repository or an `if` about business state, extract a use case. Test: if you'd want to unit-test it without Next, it's a use case."
  - id: NX-LAYER-07
    severity: error
    enforcement: "review"
    doc: docs/nextjs/architecture.md#layer-rules
    rule: "A use case receives its dependencies as one object typed `<UseCase>Deps`. No global singletons inside `application/`."
  - id: NX-LAYER-08
    severity: error
    enforcement: "eslint:no-restricted-syntax"
    doc: docs/nextjs/architecture.md#layer-rules
    rule: "Errors cross layer boundaries as values (`Result`), never as thrown exceptions. `throw` is reserved for bugs and does not appear in `domain/` or `application/`."
  - id: NX-LAYER-09
    severity: error
    enforcement: "eslint:boundaries (no-cycle via import-x)"
    doc: docs/nextjs/architecture.md#layer-rules
    rule: "If two modules import each other, merge them or extract a third."
  - id: NX-LAYER-10
    severity: error
    enforcement: "eslint:boundaries"
    doc: docs/nextjs/architecture.md#layer-rules
    rule: "Code that predates the modules is declared as the `legacy` element in the ESLint config. Legacy code keeps the imports it has but reaches a module only through `index.ts`/`server.ts`. No new feature lands in legacy; a folder leaves the list when its module is done."
  - id: NX-LAYER-11
    severity: error
    enforcement: "eslint:nextjs/actions-use-commands + eslint:boundaries + eslint:nextjs/require-server-only"
    doc: docs/nextjs/architecture.md#layer-rules
    rule: "`commands.ts` is optional: it appears with the module's first write use case, so anemic modules have none. It wires each use case to its repositories, unit of work, policy and clock and exports it under the use case's name, taking the `Requester` the caller signed in as its first argument: `payOrder(requester, input)`. It holds no business rule, reads no session and revalidates nothing. Once it exists, `actions.ts` calls it and imports no value from its own `application/` or `infra/`; `server.ts` re-exports it for workers, other modules and tests."
  - id: NX-AUTH-01
    severity: error
    enforcement: "review"
    doc: docs/nextjs/architecture.md#authorization--tenancy
    rule: "`Requester` is produced in `lib/safe-action.ts` (actions) and in `queries.ts` (reads). Nothing else reads the session: `commands.ts` receives the requester from its caller."
  - id: NX-AUTH-02
    severity: error
    enforcement: "review"
    doc: docs/nextjs/architecture.md#authorization--tenancy
    rule: "Authorization decisions live in the use case, which receives `requester` in `Deps` and returns `err({ _tag: 'Forbidden' })`. An action that skips the application layer checks `requester` itself; that is the only business `if` allowed in an action."
  - id: NX-AUTH-03
    severity: error
    enforcement: "review (test required)"
    doc: docs/nextjs/architecture.md#authorization--tenancy
    rule: "Tenant isolation is enforced in the repository: every method on tenant-owned data takes the tenant id as its first argument and names it in the query. The repository's integration test proves another tenant's rows can be neither read nor changed."
  - id: NX-AUTH-04
    severity: warn
    enforcement: "review"
    doc: docs/nextjs/architecture.md#authorization--tenancy
    rule: "Database row policies, where the platform offers them, are a second net for tenant isolation. A permission rule is never written there."
  - id: NX-AUTH-05
    severity: error
    enforcement: "review"
    doc: docs/nextjs/architecture.md#authorization--tenancy
    rule: "Shared data (registries, templates, lookups) is read without a requester; its repository methods take no tenant id. The port makes the distinction visible: tenant-owned methods start with the tenant id, shared methods don't."
  - id: NX-AUTH-06
    severity: error
    enforcement: "review"
    doc: docs/nextjs/architecture.md#authorization--tenancy
    rule: "System callers (scheduled runs, workers, delivery jobs) use the same repositories as users and name their tenant explicitly. There is no bypass path."
  - id: NX-AUTH-07
    severity: error
    enforcement: "review"
    doc: docs/nextjs/architecture.md#authorization--tenancy
    rule: "Components never decide permissions; they receive booleans like `can.editOrder` computed server-side in `queries.ts`."
  - id: NX-TYPE-01
    severity: error
    enforcement: "review"
    doc: docs/nextjs/architecture.md#type-safety-chain
    rule: "One source of truth per shape (table above). If you write the same type twice by hand, one of them is already wrong."
  - id: NX-TYPE-02
    severity: error
    enforcement: "eslint:@typescript-eslint/consistent-type-assertions"
    doc: docs/nextjs/architecture.md#type-safety-chain
    rule: "No `as` cast across a layer boundary. If the types don't line up, add a mapper in `infra/` or fix the schema. `as` is allowed only in `*.mapper.ts`, `lib/db/`, brand constructors (`domain/*-id.ts`) and `as const`."
  - id: NX-TYPE-03
    severity: error
    enforcement: "review"
    doc: docs/nextjs/architecture.md#type-safety-chain
    rule: "Validate at the edge once: action input, webhook payload, env, external API responses, database function results. Inside the module, trust the types."
  - id: NX-TYPE-04
    severity: error
    enforcement: "review"
    doc: docs/nextjs/architecture.md#type-safety-chain
    rule: "Forms use the same contract schema as the action. Client and server disagree on nothing."
  - id: NX-TYPE-05
    severity: warn
    enforcement: "review"
    doc: docs/nextjs/architecture.md#type-safety-chain
    rule: "Ids and money are branded primitives (`type OrderId = string & { __brand: 'OrderId' }`)."
  - id: NX-TYPE-06
    severity: error
    enforcement: "review"
    doc: docs/nextjs/architecture.md#type-safety-chain
    rule: "Importing a module never requires infrastructure configuration. `lib/env.ts` validates at build everything modules read; connection secrets are validated on first use in `lib/db/client.ts`."
  - id: NX-ERR-01
    severity: error
    enforcement: "eslint:no-restricted-syntax (throw) + review"
    doc: docs/nextjs/architecture.md#errors
    rule: "Use cases return `Result`, never throw. Actions translate `Result` into the action client's result shape."
  - id: NX-ERR-02
    severity: error
    enforcement: "eslint:nextjs/tag-matches-type-name + tsc"
    doc: docs/nextjs/architecture.md#errors
    rule: "Errors are tagged unions; `_tag` equals the TypeScript type name. The action switches exhaustively."
  - id: NX-ERR-03
    severity: error
    enforcement: "review"
    doc: docs/nextjs/architecture.md#errors
    rule: "`SignedOut`, `Forbidden`, `NotFound`, `Conflict`, `Unexpected` come from `lib/errors.ts`, never redefined per module."
  - id: NX-ERR-04
    severity: error
    enforcement: "review"
    doc: docs/nextjs/architecture.md#errors
    rule: "The raw `_tag` never appears in the UI; the client maps tags to copy with an exhaustive map."
  - id: NX-CACHE-01
    severity: error
    enforcement: "eslint:boundaries/external (`next/cache`)"
    doc: docs/nextjs/architecture.md#caching--revalidation
    rule: "Caching primitives (`unstable_cache`, `\"use cache\"`, `cacheTag`) appear only in `queries.ts`; `revalidate*` appears only in `actions.ts`."
  - id: NX-CACHE-02
    severity: error
    enforcement: "eslint:nextjs/no-inline-cache-tags"
    doc: docs/nextjs/architecture.md#caching--revalidation
    rule: "Tags are constants exported from `queries.ts` (`ORDER_TAGS = { all: 'orders', one: (id) => \\`order:${id}\\` }`). Tag strings are never typed inline."
  - id: NX-CACHE-03
    severity: warn
    enforcement: "review"
    doc: docs/nextjs/architecture.md#caching--revalidation
    rule: "One `all` tag per aggregate for lists, one `one(id)` tag for detail views. Nothing finer until a measured need."
  - id: NX-CACHE-04
    severity: error
    enforcement: "eslint:boundaries/external"
    doc: docs/nextjs/architecture.md#caching--revalidation
    rule: "Revalidation happens in the action after the use case returns `ok`. Use cases and repositories never import `revalidate*`."
  - id: NX-CACHE-05
    severity: error
    enforcement: "review"
    doc: docs/nextjs/architecture.md#caching--revalidation
    rule: "A write that affects another module's reads calls that module's exported `revalidate<Noun>(id)` from its `index.ts`, never its tag strings."
  - id: NX-CACHE-06
    severity: warn
    enforcement: "review"
    doc: docs/nextjs/architecture.md#caching--revalidation
    rule: "`revalidatePath` only for routes without a natural aggregate."
  - id: NX-XMOD-01
    severity: error
    enforcement: "review"
    doc: docs/nextjs/architecture.md#cross-module-communication
    rule: "Two mechanisms: a **direct call** through the other module's `index.ts`/`server.ts` when A needs B's answer now; a **domain event** when A only needs to inform B. Start with direct calls; introduce events at the second subscriber or when the call would cross a transaction boundary."
  - id: NX-XMOD-02
    severity: error
    enforcement: "review"
    doc: docs/nextjs/architecture.md#cross-module-communication
    rule: "Events are collected by the use case through an `EventCollector` port and dispatched after commit via `lib/events.ts` by whoever ran the use case: the module's `commands.ts` when it has one, otherwise the action. Handlers live in the receiving module: `modules/billing/application/on-order-paid.ts`, which imports the event type (types only) from the publisher's `index.ts`, is wired in `modules/billing/commands.ts` and is reached through `modules/billing/server.ts`."
  - id: NX-XMOD-03
    severity: error
    enforcement: "review + db inventory"
    doc: docs/nextjs/architecture.md#cross-module-communication
    rule: "A database trigger is never an event bus."
  - id: NX-DB-01
    severity: error
    enforcement: "review + CI"
    doc: docs/nextjs/architecture.md#database
    rule: "One schema source of truth, declared in `ARCHITECTURE.md`: **code-first** (ORM definitions generate migrations) or **migrations-first** (migrations are hand-written, ORM definitions are generated by introspection). Generated files are never edited; CI fails on drift."
  - id: NX-DB-02
    severity: error
    enforcement: "review"
    doc: docs/nextjs/architecture.md#database
    rule: "A database function or trigger is allowed only in categories A–E and has an inventory row: name, category, caller, wrapping repository method, test. A migration that adds one adds the row."
  - id: NX-DB-03
    severity: error
    enforcement: "review"
    doc: docs/nextjs/architecture.md#database
    rule: "No business rule inside database code: no pricing, no status decisions, no notifications. Category A/B code takes already-validated input and performs the write or read."
  - id: NX-DB-04
    severity: error
    enforcement: "review"
    doc: docs/nextjs/architecture.md#database
    rule: "Not a valid reason for database code: \"easier in SQL\", \"the platform makes it convenient\", \"to avoid N+1\" (use a join or CTE), \"to enforce permissions\"."
  - id: NX-DB-05
    severity: error
    enforcement: "review"
    doc: docs/nextjs/architecture.md#database
    rule: "A constraint the database refuses becomes a tagged error in the repository (`Conflict` or a domain error), translated with `lib/db/errors.ts`. Nothing above `infra/` sees a driver error."
  - id: NX-DB-06
    severity: error
    enforcement: "eslint:boundaries"
    doc: docs/nextjs/architecture.md#database
    rule: "Transactions: `lib/db/transaction.ts` exposes `withTransaction`; only `infra/` calls it. A use case that needs several writes in one transaction receives a `UnitOfWork` port that the module's `infra/` implements."
  - id: NX-DB-07
    severity: error
    enforcement: "review"
    doc: docs/nextjs/architecture.md#database
    rule: "Every repository statement runs inside a transaction with a statement timeout. Interactive and system callers have different budgets; the numbers live in the binding."
  - id: NX-DB-08
    severity: error
    enforcement: "review"
    doc: docs/nextjs/architecture.md#database
    rule: "On tenant-owned tables the only triggers are `updated_at` and audit. No trigger changes another table's business data (category D excepted, with inventory row)."
  - id: NX-DB-09
    severity: warn
    enforcement: "review"
    doc: docs/nextjs/architecture.md#database
    rule: "Views are fine for read models (category B); they are typed through the ORM."
  - id: NX-RICH-01
    severity: error
    enforcement: "review"
    doc: docs/nextjs/architecture.md#when-to-go-rich-vs-anemic
    rule: "Anemic module shape: `contracts.ts` + `queries.ts` + `actions.ts` + `index.ts` + `server.ts` + `infra/<noun>.repository.ts`. No `domain/`, no `application/`, no `commands.ts` until promotion."
  - id: NX-RICH-02
    severity: error
    enforcement: "review"
    doc: docs/nextjs/architecture.md#when-to-go-rich-vs-anemic
    rule: "Promotion: the moment an action contains an `if` about business state, or a second action needs the same calculation, extract a use case and a `domain/` file."
  - id: NX-RICH-03
    severity: error
    enforcement: "review"
    doc: docs/nextjs/architecture.md#when-to-go-rich-vs-anemic
    rule: "\"Rich\" means plain types and pure functions, not classes: `applyPayment(order, payment): Result<Order, OrderError>`."
  - id: NX-RICH-04
    severity: error
    enforcement: "review"
    doc: docs/nextjs/architecture.md#when-to-go-rich-vs-anemic
    rule: "Reads go `queries.ts → repository`. A read use case exists only when the read carries authorization or derivation logic (`can.*` flags)."
  - id: NX-MIG-01
    severity: error
    enforcement: "review"
    doc: docs/nextjs/architecture.md#refactoring-playbook-for-existing-projects
    rule: "No new database code may be added during the transition unless it passes NX-DB-02/03, even in untouched modules."
  - id: NX-MIG-02
    severity: error
    enforcement: "review"
    doc: docs/nextjs/architecture.md#refactoring-playbook-for-existing-projects
    rule: "No new code imports a legacy helper that a module already replaced."
  - id: NX-MIG-03
    severity: error
    enforcement: "review"
    doc: docs/nextjs/architecture.md#refactoring-playbook-for-existing-projects
    rule: "A half-migrated module carries a `MIGRATING.md` ([template](../templates/MIGRATING.md)) listing what still bypasses it."
  - id: NX-MIG-04
    severity: error
    enforcement: "review"
    doc: docs/nextjs/architecture.md#refactoring-playbook-for-existing-projects
    rule: "Every deviation from these rules is an entry in the project's `ARCHITECTURE.md` ([template](../templates/ARCHITECTURE.md)): decision, where enforced, where recorded. Add the entry before you deviate."
  - id: NX-NAME-01
    severity: error
    enforcement: "eslint:check-file"
    doc: docs/nextjs/naming.md#general-rules
    rule: "Files and folders are `kebab-case`. Route folders follow Next conventions: `(group)`, `[param]`, `_private`."
  - id: NX-NAME-02
    severity: error
    enforcement: "eslint:@typescript-eslint/naming-convention"
    doc: docs/nextjs/naming.md#general-rules
    rule: "Types, interfaces and components are `PascalCase`; functions and variables `camelCase`; module-level constants may be `SCREAMING_SNAKE_CASE`. No `I` prefix on interfaces, no `Impl` suffix."
  - id: NX-NAME-03
    severity: error
    enforcement: "eslint:nextjs/use-case-export-name"
    doc: docs/nextjs/naming.md#general-rules
    rule: "In `application/<use-case>.ts` and in component files the file exports exactly one value whose name is the camelCase/PascalCase of the file name. Other files (`actions.ts`, `queries.ts`, `contracts.ts`, `ports.ts`, `errors.ts`, `events.ts`, entity files) export several things by design."
  - id: NX-NAME-04
    severity: warn
    enforcement: "review"
    doc: docs/nextjs/naming.md#general-rules
    rule: "Singular for a thing, plural for a collection: `order.ts` holds `Order`; `orders` table; `OrderRepository`."
  - id: NX-NAME-05
    severity: warn
    enforcement: "review"
    doc: docs/nextjs/naming.md#general-rules
    rule: "No abbreviations except universal ones (`id`, `url`, `db`, `dto`, `ui`, `env`)."
  - id: NX-NAME-06
    severity: warn
    enforcement: "review"
    doc: docs/nextjs/naming.md#general-rules
    rule: "Booleans read as predicates: `isPaid`, `hasItems`, `canShip`."
  - id: NX-NAME-07
    severity: warn
    enforcement: "review"
    doc: docs/nextjs/naming.md#general-rules
    rule: "Names say what, not how; prefer the ubiquitous language of the business over technical synonyms."
  - id: NX-NAME-08
    severity: error
    enforcement: "review"
    doc: docs/nextjs/naming.md#general-rules
    rule: "Generated code keeps the generator's names. Naming rules apply to hand-written code only."
  - id: NX-NAME-10
    severity: error
    enforcement: "review"
    doc: docs/nextjs/naming.md#folders--modules
    rule: "A module name is a business noun, never a technical one: not `api`, `utils`, `common`, `shared`."
  - id: NX-NAME-11
    severity: error
    enforcement: "eslint:check-file (folder)"
    doc: docs/nextjs/naming.md#folders--modules
    rule: "Dynamic route params are `camelCase` and end in `Id` when they are ids: `[orderId]`."
  - id: NX-NAME-12
    severity: error
    enforcement: "eslint:nextjs/no-server-exports-from-index"
    doc: docs/nextjs/naming.md#folders--modules
    rule: "`index.ts` exports contract schemas, domain types and values, use-case types, actions and browser-safe components; never a use-case function, whose `Deps` only `commands.ts` can wire. `server.ts` re-exports `queries.ts` and `commands.ts`. Neither re-exports `infra/`."
  - id: NX-NAME-20
    severity: error
    enforcement: "review"
    doc: docs/nextjs/naming.md#domain-layer-domain
    rule: "No `Model`, `Entity`, `Domain`, `VO` suffix. The folder says it is domain."
  - id: NX-NAME-21
    severity: warn
    enforcement: "review"
    doc: docs/nextjs/naming.md#domain-layer-domain
    rule: "Behaviour functions are business verbs: `applyPayment`, `cancel`. Not `updateStatus`, not `setPaid`."
  - id: NX-NAME-22
    severity: error
    enforcement: "eslint:nextjs/tag-matches-type-name"
    doc: docs/nextjs/naming.md#domain-layer-domain
    rule: "Errors are named for the fact that blocks the action (`OrderAlreadyPaid`), not the attempt. `_tag` equals the type name."
  - id: NX-NAME-23
    severity: error
    enforcement: "review"
    doc: docs/nextjs/naming.md#domain-layer-domain
    rule: "Events are past tense; commands are never defined in `domain/`."
  - id: NX-NAME-24
    severity: warn
    enforcement: "review"
    doc: docs/nextjs/naming.md#domain-layer-domain
    rule: "No `value-objects/` subfolder until a module has more than five."
  - id: NX-NAME-30
    severity: warn
    enforcement: "review"
    doc: docs/nextjs/naming.md#application-layer-application
    rule: "Command verbs: `create`, `update`, `delete`, `cancel`, `approve`, `submit`, `assign`, `archive`, or the business verb (`shipOrder`)."
  - id: NX-NAME-31
    severity: warn
    enforcement: "review"
    doc: docs/nextjs/naming.md#application-layer-application
    rule: "Query verbs: `get` (one, errors when missing), `find` (one, may be null), `list`, `search`, `count`, `exists`. Repositories use the same vocabulary plus `save` (insert or update); no `create`/`update` split."
  - id: NX-NAME-32
    severity: error
    enforcement: "review"
    doc: docs/nextjs/naming.md#application-layer-application
    rule: "Dependencies are one object typed `<UseCase>Deps`, never positional."
  - id: NX-NAME-33
    severity: error
    enforcement: "review"
    doc: docs/nextjs/naming.md#application-layer-application
    rule: "`NotFound`, `Forbidden`, `SignedOut`, `Conflict`, `Unexpected` come from `lib/errors.ts`; the domain does not know about requesters or lookups."
  - id: NX-NAME-34
    severity: error
    enforcement: "review"
    doc: docs/nextjs/naming.md#application-layer-application
    rule: "Tenant-owned repository methods take the tenant id first: `findById(tenantId, id)`. Shared-data methods take no tenant id."
  - id: NX-NAME-40
    severity: error
    enforcement: "review"
    doc: docs/nextjs/naming.md#infra-layer-infra-and-database
    rule: "A repository file is named after the aggregate, not the table."
  - id: NX-NAME-41
    severity: error
    enforcement: "review"
    doc: docs/nextjs/naming.md#infra-layer-infra-and-database
    rule: "Mappers are the only place that knows both `OrderRow` and `Order`."
  - id: NX-NAME-42
    severity: warn
    enforcement: "review"
    doc: docs/nextjs/naming.md#infra-layer-infra-and-database
    rule: "Adapter files start with the external system so they sort together."
  - id: NX-NAME-43
    severity: warn
    enforcement: "review"
    doc: docs/nextjs/naming.md#infra-layer-infra-and-database
    rule: "Postgres naming as above; a SQL linter in the binding may enforce it."
  - id: NX-NAME-50
    severity: error
    enforcement: "eslint:nextjs/action-suffix"
    doc: docs/nextjs/naming.md#ui-layer-actionsts-queriests-components-app
    rule: "Every export of `actions.ts` ends in `Action` (except `revalidate<Noun>`); nothing outside `actions.ts` ends in `Action`. Type exports are ignored; `index.ts` and `server.ts` re-export the module's own actions under their names."
  - id: NX-NAME-51
    severity: warn
    enforcement: "review"
    doc: docs/nextjs/naming.md#ui-layer-actionsts-queriests-components-app
    rule: "Component role from the vocabulary above before inventing one."
  - id: NX-NAME-52
    severity: error
    enforcement: "review"
    doc: docs/nextjs/naming.md#ui-layer-actionsts-queriests-components-app
    rule: "No `Component`, `View`, `Widget` suffix. No `Container`/`Presenter` split."
  - id: NX-NAME-53
    severity: warn
    enforcement: "review"
    doc: docs/nextjs/naming.md#ui-layer-actionsts-queriests-components-app
    rule: "Handler props `on<Event>`; handlers inside a component `handle<Event>`. Boolean props adjectives without `is` (`disabled`, `open`); state keeps `is` (`isOpen`)."
  - id: NX-NAME-60
    severity: error
    enforcement: "eslint:nextjs/schema-suffix"
    doc: docs/nextjs/naming.md#contracts--types-contractsts-lib
    rule: "A contract schema is `camelCase` + `Schema`; its inferred type is the same name in `PascalCase` without the suffix."
  - id: NX-NAME-61
    severity: error
    enforcement: "review"
    doc: docs/nextjs/naming.md#contracts--types-contractsts-lib
    rule: "`Dto` is the only suffix for shapes that cross the wire. `Payload`, `Request`, `Response`, `Data`, `Info` are not used. `Input` is for use case arguments. Domain types have no suffix."
  - id: NX-NAME-62
    severity: error
    enforcement: "eslint:nextjs/tag-matches-type-name"
    doc: docs/nextjs/naming.md#contracts--types-contractsts-lib
    rule: "A tagged union's discriminant is always `_tag` and its value equals the type name."
  - id: NX-NAME-70
    severity: error
    enforcement: "eslint:check-file"
    doc: docs/nextjs/naming.md#tests
    rule: "Test file suffixes as above; test files are exempt from layer rules."
  - id: NX-NAME-71
    severity: warn
    enforcement: "review"
    doc: docs/nextjs/naming.md#tests
    rule: "Test names describe behaviour: `it('rejects payment on an already paid order')`."
  - id: NX-NAME-72
    severity: warn
    enforcement: "review"
    doc: docs/nextjs/naming.md#tests
    rule: "`InMemory` for hand-written doubles with behaviour, `Stub` for canned answers, `Mock` only when assertions are made on calls."
  - id: NX-TEST-01
    severity: error
    enforcement: "review"
    doc: docs/nextjs/testing.md#
    rule: "Every use case has a unit test next to it, run with in-memory fakes for its ports. No database, no Next."
  - id: NX-TEST-02
    severity: error
    enforcement: "review"
    doc: docs/nextjs/testing.md#
    rule: "Every repository has an integration test (`*.integration.test.ts`) against a real database. For tenant-owned data it proves another tenant's rows can be neither read nor changed (NX-AUTH-03)."
  - id: NX-TEST-03
    severity: error
    enforcement: "review"
    doc: docs/nextjs/testing.md#
    rule: "Integration tests run in the normal test command and skip themselves when no local database stack is running (`tests/support/local-stack.ts`). They never silently pass."
  - id: NX-TEST-04
    severity: error
    enforcement: "review"
    doc: docs/nextjs/testing.md#
    rule: "Database code in categories A–E (NX-DB-02) has a database-level test; the binding names the tool."
  - id: NX-TEST-05
    severity: warn
    enforcement: "review"
    doc: docs/nextjs/testing.md#
    rule: "Browser tests cover user goals, not components: one `tests/browser/<flow>.spec.ts` per critical flow."
  - id: NX-TEST-06
    severity: error
    enforcement: "review"
    doc: docs/nextjs/testing.md#
    rule: "Domain functions are tested by example tables, not by mocking: `applyPayment` with a paid order returns `OrderAlreadyPaid`."
  - id: NX-TEST-07
    severity: error
    enforcement: "eslint:config"
    doc: docs/nextjs/testing.md#
    rule: "Test files and `__fakes__/` are exempt from layer import rules but not from naming rules."
  - id: NX-TEST-08
    severity: warn
    enforcement: "review"
    doc: docs/nextjs/testing.md#
    rule: "Test data comes from factories (`tests/factories/<noun>.ts`, `anOrder({ status: 'paid' })`), not from inline literals repeated across tests."
  - id: NX-DRZ-01
    severity: error
    enforcement: "eslint:boundaries/external"
    doc: docs/nextjs/bindings/drizzle.md#rules
    rule: "Only `lib/db/**` and `modules/*/infra/**` import `drizzle-orm`."
  - id: NX-DRZ-02
    severity: error
    enforcement: "review"
    doc: docs/nextjs/bindings/drizzle.md#rules
    rule: "Row types are inferred in `infra/` with `InferSelectModel` / `InferInsertModel` as `<Noun>Row` / `New<Noun>Row`. Never hand-written."
  - id: NX-DRZ-03
    severity: error
    enforcement: "CI"
    doc: docs/nextjs/bindings/drizzle.md#rules
    rule: "**Migrations-first** projects: `drizzle-kit pull` writes `lib/db/schema.ts` and `relations.ts`; nothing runs `generate`, `push` or `migrate`; a CI job fails when the generated files drift. Generated identifiers are kept as emitted (`orders`, not `ordersTable`) — NX-NAME-08."
  - id: NX-DRZ-04
    severity: error
    enforcement: "review"
    doc: docs/nextjs/bindings/drizzle.md#rules
    rule: "**Code-first** projects: tables are `export const <nouns>Table = pgTable('<nouns>', …)`, enums `<noun>StatusEnum = pgEnum('<noun>_status', …)`; migrations come from `drizzle-kit generate --name <verb>-<what>`."
  - id: NX-DRZ-05
    severity: error
    enforcement: "review"
    doc: docs/nextjs/bindings/drizzle.md#rules
    rule: "`withTransaction` sets `statement_timeout` per caller class: interactive callers 8 s, system callers 5 min (defaults; the project may change them in `ARCHITECTURE.md`)."
  - id: NX-DRZ-06
    severity: error
    enforcement: "eslint:boundaries"
    doc: docs/nextjs/bindings/drizzle.md#rules
    rule: "The `UnitOfWork` port is implemented in `infra/unit-of-work.ts` by delegating to `withTransaction`. Use cases never see the Drizzle transaction object."
  - id: NX-DRZ-07
    severity: warn
    enforcement: "review"
    doc: docs/nextjs/bindings/drizzle.md#rules
    rule: "Read models (category B) that are views are declared with `pgView` so they are typed."
  - id: NX-DRZ-08
    severity: warn
    enforcement: "review"
    doc: docs/nextjs/bindings/drizzle.md#rules
    rule: "A repository runs no raw SQL except to call a category A/B function; the call is wrapped by exactly one method and its result parsed with a contract schema."
  - id: NX-NSA-01
    severity: error
    enforcement: "review"
    doc: docs/nextjs/bindings/next-safe-action.md#
    rule: "`lib/safe-action.ts` exports two clients: `actionClient` (no identity) and `memberActionClient` (middleware signs the caller in once and puts `requester` in `ctx`, or ends the call with `returnServerError(signedOut())`). `ctx.requester` is therefore never null inside an action, and no action checks for it. Nothing else creates a client. The shipped template is tested with `next-safe-action` 8.7.3."
  - id: NX-NSA-02
    severity: error
    enforcement: "eslint:nextjs/action-suffix"
    doc: docs/nextjs/bindings/next-safe-action.md#
    rule: "Every export of `actions.ts` is `memberActionClient.inputSchema(xInputSchema).action(...)` or `actionClient...`, named `<useCase>Action` (NX-NAME-50)."
  - id: NX-NSA-03
    severity: error
    enforcement: "review"
    doc: docs/nextjs/bindings/next-safe-action.md#
    rule: "`handleServerError` in `lib/safe-action.ts` maps a thrown error to `Unexpected` with a trace id and logs it; tagged errors returned via `Result` are passed through as `serverError` carrying `_tag`."
  - id: NX-NSA-04
    severity: error
    enforcement: "review"
    doc: docs/nextjs/bindings/next-safe-action.md#
    rule: "The client reads results with `useAction` / `useOptimisticAction` and maps `serverError._tag` to copy with an exhaustive record (NX-ERR-04)."
  - id: NX-NSA-05
    severity: error
    enforcement: "eslint:boundaries/external"
    doc: docs/nextjs/bindings/next-safe-action.md#
    rule: "`next-safe-action` is imported only in `lib/safe-action.ts`, `modules/*/actions.ts` and client components (`/hooks`)."
  - id: NX-SB-01
    severity: error
    enforcement: "review"
    doc: docs/nextjs/bindings/supabase.md#rules
    rule: "Supabase migrations are the only schema source (`supabase migration new`, `supabase/migrations/`). The project is **migrations-first** (NX-DB-01, NX-DRZ-03)."
  - id: NX-SB-02
    severity: error
    enforcement: "review (integration test)"
    doc: docs/nextjs/bindings/supabase.md#rules
    rule: "The app connects with the ORM as the database owner through the transaction pooler. Row policies therefore do **not** apply to app queries; tenant isolation is enforced in the repository (NX-AUTH-03). Row policies guard only the Data API (NX-AUTH-04)."
  - id: NX-SB-03
    severity: error
    enforcement: "review"
    doc: docs/nextjs/bindings/supabase.md#rules
    rule: "`Requester` is built from `supabase.auth.getUser()` in `lib/safe-action.ts` and `lib/auth/requester.ts`. `tenantId` is the user's id until shared workspaces exist, when it becomes the workspace id; `roles` is empty until roles exist."
  - id: NX-SB-04
    severity: error
    enforcement: "db inventory"
    doc: docs/nextjs/bindings/supabase.md#rules
    rule: "`handle_new_user` on `auth.users` is a category D hook (NX-DB-02): it provisions the account row and its defaults however a user appears. It is the only trigger allowed to write business rows."
  - id: NX-SB-05
    severity: error
    enforcement: "db inventory"
    doc: docs/nextjs/bindings/supabase.md#rules
    rule: "Queue claims (`claim_*`, `finalize_*`) are category A; `SECURITY DEFINER` helpers used by policies or `CHECK` constraints (`is_iana_timezone`) are category C; read-model functions for the Data API are category B. All have inventory rows."
  - id: NX-SB-06
    severity: error
    enforcement: "CI"
    doc: docs/nextjs/bindings/supabase.md#rules
    rule: "Database tests (policies, constraints, category A–E functions) are written with pgTAP in `supabase/tests/` and run in CI against the local stack (NX-TEST-04)."
  - id: NX-SB-07
    severity: error
    enforcement: "review"
    doc: docs/nextjs/bindings/supabase.md#rules
    rule: "Integration tests skip with `describe.skipIf(!localStack())` from `tests/support/local-stack.ts` when `supabase status` reports no running stack."
  - id: NX-SB-08
    severity: warn
    enforcement: "eslint:boundaries/external (`@supabase/supabase-js` only in `lib/auth/**`, `lib/storage/**`, `lib/safe-action.ts`)"
    doc: docs/nextjs/bindings/supabase.md#rules
    rule: "The Supabase JS client is used for Auth and Storage only; data access goes through the ORM. A module that needs the Data API (realtime, edge) records it in `ARCHITECTURE.md`."
  - id: NX-ZOD-01
    severity: error
    enforcement: "eslint:boundaries/external"
    doc: docs/nextjs/bindings/zod.md#
    rule: "`zod` is imported in `contracts.ts`, `lib/env.ts`, `infra/` (external payloads, function results), `app/api/**` (webhooks) and `components/` (forms via resolver). Never in `domain/`; in `application/` only as `import type`."
  - id: NX-ZOD-02
    severity: error
    enforcement: "eslint:nextjs/schema-suffix"
    doc: docs/nextjs/bindings/zod.md#
    rule: "Every `z.*` schema declaration is `camelCase` + `Schema`; its type is `z.infer<typeof xSchema>` named `X` (NX-NAME-60)."
  - id: NX-ZOD-03
    severity: error
    enforcement: "review"
    doc: docs/nextjs/bindings/zod.md#
    rule: "Branded ids: `orderIdSchema = z.string().transform(OrderId)` in `contracts.ts`; the `OrderId` constructor lives in `domain/order-id.ts`."
  - id: NX-ZOD-04
    severity: error
    enforcement: "review"
    doc: docs/nextjs/bindings/zod.md#
    rule: "Forms use the action's input schema through `@hookform/resolvers/zod` (NX-TYPE-04). A separate `<noun>FormSchema` exists only when the form shape differs from the action input."
  - id: NX-ZOD-05
    severity: warn
    enforcement: "eslint:no-restricted-syntax (`process.env` outside `lib/env.ts`, `lib/db/client.ts`)"
    doc: docs/nextjs/bindings/zod.md#
    rule: "`lib/env.ts` uses `@t3-oss/env-nextjs` or plain `z.object(...).parse(process.env)`; either way it is the only reader of `process.env` besides `lib/db/client.ts`."
