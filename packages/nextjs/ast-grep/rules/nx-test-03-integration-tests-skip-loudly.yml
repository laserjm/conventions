id: nx-test-03-integration-tests-skip-loudly
language: typescript
severity: error
message: "NX-TEST-03: an integration test uses describeIntegration() from '@conventions/nextjs/testing', which skips with a message when no local stack runs (NX-SB-07)."
files: ["**/*.integration.test.ts"]
rule:
  kind: program
  not:
    has:
      stopBy: end
      kind: import_statement
      regex: 'describeIntegration'
