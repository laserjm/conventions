id: nx-nsa-02-actions-are-client-chains
language: typescript
severity: error
message: "NX-NSA-02: every action is `memberActionClient.inputSchema(xInputSchema).action(…)` or `actionClient…`; '$NAME' is not."
files: ["**/modules/*/actions.ts"]
rule:
  kind: variable_declarator
  inside: { kind: lexical_declaration, inside: { kind: export_statement } }
  all:
    - has: { field: name, pattern: $NAME }
    - has: { field: value, pattern: $INIT }
constraints:
  NAME: { regex: 'Action$' }
  INIT: { not: { regex: '^(memberActionClient|actionClient)\b' } }
