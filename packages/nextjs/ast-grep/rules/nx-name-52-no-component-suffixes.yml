id: nx-name-52-no-component-suffixes
language: tsx
severity: error
message: "NX-NAME-52: no Component, View or Widget suffix and no Container/Presenter split; name the component <Noun><Role> ('$NAME')."
files: ["**/*.tsx"]
rule:
  any:
    - kind: function_declaration
      inside: { kind: export_statement }
    - kind: variable_declarator
      inside: { kind: lexical_declaration, inside: { kind: export_statement } }
  has: { field: name, pattern: $NAME }
constraints:
  NAME: { regex: '(Component|View|Widget|Container|Presenter)$' }
