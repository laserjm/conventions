id: nx-cache-02-no-inline-cache-tags
language: typescript
severity: error
message: "NX-CACHE-02: cache tags come from an exported `<NOUN>_TAGS` constant in queries.ts, never an inline string."
rule:
  pattern: $CALLEE($ARG)
constraints:
  CALLEE:
    any:
      - regex: '^(revalidateTag|cacheTag|unstable_cacheTag)$'
      - kind: member_expression
        has: { field: property, regex: '^(revalidateTag|cacheTag|unstable_cacheTag)$' }
  ARG: { any: [{ kind: string }, { kind: template_string }] }
