id: nx-layer-06-business-if-in-action
language: typescript
severity: warning
message: "NX-LAYER-06: an `if` about business state inside an action is a use case waiting to be extracted (NX-RICH-02). Only `result.ok` and the requester check belong here."
files: ["**/modules/*/actions.ts"]
rule:
  kind: if_statement
  inside:
    stopBy: end
    pattern: $CLIENT.action($HANDLER)
  not:
    has:
      field: condition
      regex: '^\(?!?\w+\.ok\)?$|requester'
