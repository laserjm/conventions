id: nx-name-50-action-suffix-required
language: typescript
severity: error
message: "NX-NAME-50: every export of actions.ts ends in 'Action' (revalidate<Noun> excepted); '$NAME' does not."
files: ["**/modules/*/actions.ts"]
rule:
  any:
    - kind: function_declaration
      inside: { kind: export_statement }
    - kind: variable_declarator
      inside: { kind: lexical_declaration, inside: { kind: export_statement } }
  has: { field: name, pattern: $NAME }
constraints:
  NAME: { not: { regex: '(Action$|^revalidate[A-Z])' } }
