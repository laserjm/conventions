id: nx-layer-07-use-define-use-case
language: typescript
severity: error
message: "NX-LAYER-07: a use case is `export const $NAME = defineUseCase<Input, Output, Error, Deps>(async (input, deps) => …)`; the helper fixes the signature and the Result return type (NX-ERR-01, NX-NAME-32)."
files: ["**/modules/*/application/*.ts"]
ignores: ["**/application/ports.ts", "**/application/errors.ts", "**/application/events.ts", "**/application/index.ts", "**/*.test.ts"]
rule:
  any:
    - pattern: export async function $NAME($$$PARAMS) { $$$BODY }
    - pattern: export function $NAME($$$PARAMS) { $$$BODY }
    - all:
        - pattern: export const $NAME = $INIT
        - not:
            has:
              stopBy: end
              kind: call_expression
              has: { field: function, regex: '^defineUseCase$' }
