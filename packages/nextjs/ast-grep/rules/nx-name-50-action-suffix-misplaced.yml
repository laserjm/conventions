id: nx-name-50-action-suffix-misplaced
language: typescript
severity: error
message: "NX-NAME-50: '$NAME' ends in 'Action' but is declared outside actions.ts; only server actions carry the suffix."
ignores: ["**/modules/*/actions.ts"]
rule:
  any:
    - kind: function_declaration
    - kind: variable_declarator
  has: { field: name, pattern: $NAME }
constraints:
  NAME: { regex: 'Action$' }
