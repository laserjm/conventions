id: nx-cache-05-no-foreign-tags
language: typescript
severity: error
message: "NX-CACHE-05: another module's tags are private; call its exported revalidate<Noun>(id) from index.ts instead."
rule:
  kind: import_specifier
  regex: '_TAGS$'
  inside:
    stopBy: end
    kind: import_statement
    has:
      field: source
      regex: "^[\"']((@/)?modules/[^/]+|(\\.\\./)+[^/.]+)/(server|index)([\"']|\\.ts)"
