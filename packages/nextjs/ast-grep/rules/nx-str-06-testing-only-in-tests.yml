id: nx-str-06-testing-only-in-tests
language: typescript
severity: error
message: "NX-STR-06: test helpers are imported by test files and tests/ only (NX-TEST-07)."
ignores: ["**/*.test.ts", "**/*.test.tsx", "**/*.spec.ts", "**/tests/**", "**/__fakes__/**", "**/*.config.*"]
rule:
  kind: import_statement
  has:
    field: source
    regex: "^['\"](@conventions/nextjs/testing|vitest|@playwright/test)['\"]$"
