# NX-NAME-01, NX-NAME-11, NX-NAME-70, NX-STR-02 — file and folder names. `conventions lint` runs it as
#   ls-lint --config node_modules/@conventions/nextjs/ls-lint.yml
# Layer folders inside a module are checked by ESLint (boundaries/no-unknown-files), module-root files here.
ls:
  .dir: kebab-case
  .ts: kebab-case
  .tsx: kebab-case
  .mts: kebab-case
  .d.ts: kebab-case
  .test.ts: kebab-case
  .test.tsx: kebab-case
  .spec.ts: kebab-case
  .integration.test.ts: kebab-case
  .fake.ts: kebab-case
  .repository.ts: kebab-case
  .mapper.ts: kebab-case
  .config.ts: kebab-case
  .md: regex:^([A-Z_]+|[a-z0-9-]+)$
  app:
    .dir: regex:^(\([a-z0-9-]+\)|\[\.{0,3}[a-zA-Z0-9]+\]|\[\[\.\.\.[a-zA-Z0-9]+\]\]|_[a-z0-9-]+|@[a-z0-9-]+|[a-z0-9]+(-[a-z0-9]+)*)$
    .ts: kebab-case
    .tsx: kebab-case
    .test.ts: kebab-case
    .test.tsx: kebab-case
  modules:
    .dir: kebab-case
  modules/*:
    .dir: kebab-case
    .ts: regex:^(actions|queries|commands|contracts|index|server)$
    .tsx: regex:^$
    .test.ts: kebab-case
    .integration.test.ts: kebab-case
    .md: regex:^MIGRATING$
  modules/*/*:
    .dir: regex:^(__fakes__|[a-z0-9]+(-[a-z0-9]+)*)$
    .ts: kebab-case
    .tsx: kebab-case
    .test.ts: kebab-case
    .test.tsx: kebab-case
    .integration.test.ts: kebab-case
    .fake.ts: kebab-case
    .repository.ts: kebab-case
    .mapper.ts: kebab-case
ignore:
  - node_modules
  - .next
  - dist
  - coverage
  - supabase
  - public
