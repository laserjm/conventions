# docs/nextjs/architecture.md — table "auth". Edit here; docs tables and rules/nextjs.yaml are generated.
group: auth
rules:
  - id: NX-AUTH-01
    severity: error
    rule: "`Requester` is produced in `lib/safe-action.ts` (actions) and in `queries.ts` (reads). Nothing else reads the session: `commands.ts` receives the requester from its caller."
    mechanism: ast-grep
    tool: nx-auth-01-session-read-outside-edge
  - id: NX-AUTH-02
    severity: guidance
    rule: "Authorization decisions live in the use case, which receives `requester` in `Deps` and returns `err({ _tag: 'Forbidden' })`. An action that skips the application layer checks `requester` itself; that is the only business `if` allowed in an action."
    mechanism: agent
    checklist: true
  - id: NX-AUTH-03
    severity: error
    rule: "Isolation between owners is enforced in the repository: every method on owned data takes the owner's id as its first argument (`tenantId` under `isolation: tenant`, `ownerId` under `isolation: owner`) and names it in the query. The repository's integration test calls `assertIsolation()` from `@conventions/nextjs/testing`, proving another owner's rows can be neither read nor changed."
    mechanism: check
    tool: isolation-test
    isolation: [tenant, owner]
  - id: NX-AUTH-04
    severity: guidance
    rule: Database row policies, where the platform offers them, are a second net for isolation between owners. A permission rule is never written there.
    mechanism: agent
    isolation: [tenant, owner]
  - id: NX-AUTH-05
    severity: error
    rule: "Shared data (registries, templates, lookups) is read without a requester; its repository methods take no owner id. Methods on owned data take the owner's id first, typed with its brand (`TenantId` under `isolation: tenant`, `OwnerId` under `isolation: owner`), never `string`: the port makes the distinction visible and the compiler refuses a plain string."
    mechanism: check
    tool: owner-id-type
    note: "`conventions check` reports the owner's id typed `string` in `application/ports.ts` and `infra/*.repository.ts`; once those carry the brand, `tsc` refuses a plain string everywhere else."
    isolation: [tenant, owner]
  - id: NX-AUTH-06
    severity: error
    rule: "System callers (scheduled runs, workers, delivery jobs) use the same repositories as users and identify as `systemRequester(name)`. Under `isolation: tenant` or `owner` they name the owner they work for: `systemRequester(name, { tenantId })` or `systemRequester(name, { ownerId })`. There is no bypass path."
    mechanism: tsc
    tool: systemRequester
  - id: NX-AUTH-07
    severity: warn
    rule: Components never decide permissions; they receive booleans like `can.editOrder` computed server-side in `queries.ts`.
    mechanism: ast-grep
    tool: nx-auth-07-roles-in-components
  - id: NX-AUTH-08
    severity: guidance
    rule: "A system read that has to find its owner before it can name one (a queue claim that takes the next job of any owner, a sweep of expired jobs, the owner of a row found by its ID) is the one repository method that names no owner. It returns the owner's id with every row, is reached only from system callers (never an action or a page), and every read or write that follows names the owner it returned (NX-AUTH-06). A category A write fenced by a token the claim handed out (attempt number, lease) counts as following the claim. The integration test proves the follow-up methods change nothing when given another owner's id."
    mechanism: agent
    checklist: true
    isolation: [tenant, owner]
