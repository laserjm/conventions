# docs/nextjs/architecture.md — table "migration". Edit here; docs tables and rules/nextjs.yaml are generated.
group: migration
rules:
  - id: NX-MIG-01
    severity: guidance
    rule: No new database code may be added during the transition unless it passes NX-DB-02/03, even in untouched modules.
    mechanism: agent
    checklist: true
  - id: NX-MIG-02
    severity: guidance
    rule: No new code imports a legacy helper that a module already replaced.
    mechanism: agent
    checklist: true
  - id: NX-MIG-03
    severity: error
    rule: A half-migrated module carries a `MIGRATING.md` ([template](../templates/MIGRATING.md)) listing what still bypasses it.
    mechanism: check
    tool: migrating-file
  - id: NX-MIG-04
    severity: error
    rule: "Every deviation from these rules is a row in the project's `ARCHITECTURE.md` Deviations table: rule id, the files or globs it covers in backticks, why, until when. Lint and `conventions check` report findings of that rule on those paths as warnings, so the same mistake anywhere else still fails; a rule disabled in source without a row fails. Add the row before you deviate."
    mechanism: check
    tool: deviations
