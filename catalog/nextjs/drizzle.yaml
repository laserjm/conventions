# docs/nextjs/bindings/drizzle.md — table "drizzle". Edit here; docs tables and rules/nextjs.yaml are generated.
group: drizzle
rules:
  - id: NX-DRZ-01
    severity: error
    rule: Only `lib/db/**` and `modules/*/infra/**` import `drizzle-orm`.
    mechanism: eslint
    tool: boundaries/external
    reportedAs: NX-LAYER-03
  - id: NX-DRZ-02
    severity: error
    rule: Row types are inferred in `infra/` with `InferSelectModel` / `InferInsertModel` as `<Noun>Row` / `New<Noun>Row`. Never hand-written.
    mechanism: ast-grep
    tool: nx-drz-02-no-hand-written-row-types
  - id: NX-DRZ-03
    severity: error
    rule: "**Migrations-first** projects: `drizzle-kit pull` writes `lib/db/schema.ts` and `relations.ts`; nothing runs `generate`, `push` or `migrate`; a CI job fails when the generated files drift. Generated identifiers are kept as emitted (`orders`, not `ordersTable`) — NX-NAME-08."
    mechanism: ci
    tool: schema-drift
  - id: NX-DRZ-04
    severity: guidance
    rule: "**Code-first** projects: tables are `export const <nouns>Table = pgTable('<nouns>', …)`, enums `<noun>StatusEnum = pgEnum('<noun>_status', …)`; migrations come from `drizzle-kit generate --name <verb>-<what>`."
    mechanism: agent
    checklist: true
  - id: NX-DRZ-05
    severity: guidance
    rule: "`createTransactionRunner` sets `statement_timeout` per caller class: interactive callers 8 s, system callers 5 min (defaults; the project may pass its own and records it in `ARCHITECTURE.md`). A nested `withTransaction` joins the outer transaction and its timeout; `statementTimeout` overrides the budget for tests and maintenance only."
    mechanism: agent
    checklist: true
  - id: NX-DRZ-06
    severity: error
    rule: "The `UnitOfWork` port is implemented in `infra/unit-of-work.ts` by delegating to `withTransaction` from `lib/db/client.ts` with `{ rollbackOnErr: true }`: its `run` takes a `fn` that returns a `Result` and rolls back on `err`. Use cases never see the Drizzle transaction object."
    mechanism: ast-grep
    tool: nx-db-06-transactions-only-in-infra
    reportedAs: NX-DB-06
  - id: NX-DRZ-07
    severity: guidance
    rule: Read models (category B) that are views are declared with `pgView` so they are typed.
    mechanism: agent
  - id: NX-DRZ-08
    severity: warn
    rule: "A repository runs a raw statement (`execute(sql`…`)`) only to call a category A/B function, to call a category C helper when a command needs its answer before it writes (`select public.is_iana_timezone($1)`), or for a query the query builder cannot express, such as a recursive CTE (`with recursive`). Each statement is wrapped by exactly one repository method and its result parsed with a contract schema; functions are called schema-qualified. A `sql` fragment passed to the builder (`.set({ archivedAt: sql`now()` })`) is not a raw statement."
    mechanism: ast-grep
    tool: nx-drz-08-no-raw-sql-in-repository
