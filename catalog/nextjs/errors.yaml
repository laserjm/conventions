# docs/nextjs/architecture.md — table "errors". Edit here; docs tables and rules/nextjs.yaml are generated.
group: errors
rules:
  - id: NX-ERR-01
    severity: error
    rule: "Use cases return `Result`, never throw: `defineUseCase` types the return as `Promise<Result<Output, Error>>`. Actions translate `Result` into the action client's result shape."
    mechanism: tsc
    tool: defineUseCase
  - id: NX-ERR-02
    severity: error
    rule: Errors are tagged unions; `_tag` equals the TypeScript type name. The action switches exhaustively.
    mechanism: eslint
    tool: nextjs/tag-matches-type-name
  - id: NX-ERR-03
    severity: error
    rule: "`SignedOut`, `Forbidden`, `NotFound`, `Conflict`, `Unexpected` come from `@conventions/nextjs/core`, never redefined per module."
    mechanism: ast-grep
    tool: nx-err-03-standard-errors-from-core
  - id: NX-ERR-04
    severity: warn
    rule: The raw `_tag` never appears in the UI; the client maps tags to copy with an exhaustive map.
    mechanism: ast-grep
    tool: nx-err-04-tag-in-jsx
