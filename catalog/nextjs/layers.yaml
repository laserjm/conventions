# docs/nextjs/architecture.md — table "layers". Edit here; docs tables and rules/nextjs.yaml are generated.
group: layers
rules:
  - id: NX-LAYER-01
    severity: error
    rule: Imports follow the table above. `domain/` imports nothing outside its module except `@conventions/nextjs/core`.
    mechanism: eslint
    tool: boundaries/element-types
    note: A project migrating from 0.1 may still hold copies of lib/result.ts and lib/errors.ts; domain/ and application/ may import those two files until they are deleted (NX-ERR-03 reports the copy).
  - id: NX-LAYER-02
    severity: error
    rule: "`domain/` and `application/` import no framework or vendor package (`react`, `next/*`, the ORM, the contract-schema library at runtime). Type-only imports from `contracts.ts` are allowed in `application/`."
    mechanism: eslint
    tool: boundaries/external
    note: fetch() in domain/ or application/ is reported by ast-grep rule nx-layer-02-no-fetch-in-pure-layers.
  - id: NX-LAYER-03
    severity: error
    rule: Only `infra/` and `lib/db` import the ORM and `lib/db`.
    mechanism: eslint
    tool: boundaries/external
  - id: NX-LAYER-04
    severity: error
    rule: Another module is reached only through its `index.ts` or `server.ts`. Never import another module's `domain/`, `application/`, `infra/`, `contracts.ts` or ui files.
    mechanism: eslint
    tool: boundaries/element-types
  - id: NX-LAYER-05
    severity: error
    rule: "`index.ts` is safe to import from a client component: it never re-exports `infra/`, `queries.ts` or `commands.ts`, and `components/` never import them either. Server-only reads and commands are exported from `server.ts`; `server.ts`, `queries.ts` and `commands.ts` are marked `server-only`."
    mechanism: eslint
    tool: boundaries/element-types
    note: The server-only import is checked by ast-grep rule nx-layer-05-require-server-only.
  - id: NX-LAYER-06
    severity: warn
    rule: "Skipping the application layer: an action or query may call a repository directly when it needs no orchestration — a plain read, a single write with validation only, no business decision. The moment it needs a transaction, a domain function, a second repository or an `if` about business state, extract a use case. Test: if you'd want to unit-test it without Next, it's a use case."
    mechanism: ast-grep
    tool: nx-layer-06-business-if-in-action
  - id: NX-LAYER-07
    severity: error
    rule: A use case is declared with `defineUseCase<Input, Output, Error, Deps>(async (input, deps) => …)` from `@conventions/nextjs/core`; the helper fixes the signature. Dependencies arrive as one object typed `<UseCase>Deps`; no global singletons inside `application/`.
    mechanism: ast-grep
    tool: nx-layer-07-use-define-use-case
  - id: NX-LAYER-08
    severity: error
    rule: "Errors cross layer boundaries as values (`Result`), never as thrown exceptions. A refusal returns `err(...)`; an impossible state (a bug) calls `bug(message)` from `@conventions/nextjs/core`. `throw` does not appear in `domain/` or `application/`."
    mechanism: ast-grep
    tool: nx-layer-08-no-throw-in-pure-layers
  - id: NX-LAYER-09
    severity: error
    rule: If two modules import each other, merge them or extract a third.
    mechanism: eslint
    tool: import-x/no-cycle
  - id: NX-LAYER-10
    severity: error
    rule: Code that predates the modules is declared as the `legacy` element in the ESLint config. Legacy code keeps the imports it has but reaches a module only through `index.ts`/`server.ts`. No new feature lands in legacy; a folder leaves the list when its module is done. Legacy globs are anchored at the app root, so `components/**` is never a module's `components/`. Lint applies only the layer rules to legacy code; naming, cast and env rules start when the folder leaves the list. Tooling outside the app (`scripts/`, `*.config.*`) may import legacy code and module APIs.
    mechanism: eslint
    tool: boundaries/element-types
  - id: NX-LAYER-11
    severity: error
    rule: "`commands.ts` is optional: it appears with the module's first write use case, so anemic modules have none. It wires each use case to its repositories, unit of work, policy and clock and exports it under the use case's name, taking the `Requester` the caller signed in as its first argument: `payOrder(requester, input)`. It holds no business rule, reads no session and revalidates nothing. Once it exists, `actions.ts` calls it and imports no value from its own `application/` or `infra/`; `server.ts` re-exports it for workers, other modules and tests."
    mechanism: eslint
    tool: nextjs/actions-use-commands
  - id: NX-LAYER-12
    severity: guidance
    rule: "Wording lives with its audience. Text a use case stores, or that the UI and a sent message both show, is `domain/`: a pure function over the module's own shapes, with another module's wording passed in as arguments that `commands.ts` wires from its `index.ts`; that wording, in turn, lives in its own module's `domain/`. Rendering for an external channel (an email's text and HTML, a push payload) is an `infra/` adapter the use case reaches through a port. `components/` is the ui layer: only text the UI alone shows lives there, and `domain/`, `application/`, `infra/` and `commands.ts` never import it."
    mechanism: agent
    checklist: true
