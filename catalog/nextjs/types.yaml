# docs/nextjs/architecture.md — table "types". Edit here; docs tables and rules/nextjs.yaml are generated.
group: types
rules:
  - id: NX-TYPE-01
    severity: guidance
    rule: One source of truth per shape (table above). If you write the same type twice by hand, one of them is already wrong.
    mechanism: agent
    checklist: true
  - id: NX-TYPE-02
    severity: error
    rule: No `as` cast across a layer boundary. If the types don't line up, add a mapper in `infra/` or fix the schema. `as` is allowed only in `*.mapper.ts`, `lib/db/`, brand constructors (`domain/*-id.ts`) and `as const`. The mapper exemption is for shapes the types cannot express (a brand, a library's loose types), not for narrowing a value the code could check; a constrained `text` column is parsed (NX-ZOD-06).
    mechanism: eslint
    tool: "nx-ts/consistent-type-assertions"
  - id: NX-TYPE-03
    severity: guidance
    rule: "Validate at the edge once: action input, webhook payload, env, external API responses, database function results. Inside the module, trust the types."
    mechanism: agent
    checklist: true
  - id: NX-TYPE-04
    severity: guidance
    rule: Forms use the same contract schema as the action. Client and server disagree on nothing.
    mechanism: agent
    checklist: true
  - id: NX-TYPE-05
    severity: guidance
    rule: "Ids and money are branded primitives (`type OrderId = string & { __brand: 'OrderId' }`)."
    mechanism: agent
  - id: NX-TYPE-06
    severity: error
    rule: Importing a module never requires infrastructure configuration. `lib/env.ts` validates at build everything modules read; connection secrets are validated on first use in `lib/db/client.ts`.
    mechanism: ast-grep
    tool: nx-type-06-lazy-db-client
