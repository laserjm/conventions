# docs/nextjs/architecture.md — table "structure". Edit here; docs tables and rules/nextjs.yaml are generated.
group: structure
rules:
  - id: NX-STR-01
    severity: guidance
    rule: All paths are relative to the app root aliased `@/`. Whether the app root is `src/` is a project choice recorded in `ARCHITECTURE.md`.
    mechanism: agent
    checklist: true
  - id: NX-STR-02
    severity: error
    rule: Each feature lives in `modules/<x>/`. Layer folders are `domain/`, `application/`, `infra/`; ui-layer files are `actions.ts`, `queries.ts`, `components/`; plus `commands.ts` (optional), `contracts.ts`, `index.ts`, `server.ts`. No other names; a test file sits next to the file it tests.
    mechanism: ls-lint
    note: A file or folder in a module that is not one of these is also reported by ESLint (boundaries/no-unknown-files).
  - id: NX-STR-03
    severity: error
    rule: "`app/` contains routes only: pages, layouts, route handlers and route-local `_components/`."
    mechanism: eslint
    tool: boundaries/element-types
  - id: NX-STR-04
    severity: warn
    rule: UI used by exactly one route lives in `app/.../_components/`; UI reused across routes or needing the module's types lives in `modules/<x>/components/`; design-system primitives live in `components/ui/` and are never feature-aware. Start in `_components/`; move when a second route needs it.
    mechanism: check
    tool: route-local-components
  - id: NX-STR-05
    severity: error
    rule: "`lib/` is cross-cutting and imports nothing from `modules/`."
    mechanism: eslint
    tool: boundaries/element-types
  - id: NX-STR-06
    severity: error
    rule: Test infrastructure lives in `tests/{browser,support,factories}/`. Test files (`*.test.ts`, `*.spec.ts`, `__fakes__/`) are exempt from layer rules; nothing else imports `@conventions/nextjs/testing`.
    mechanism: ast-grep
    tool: nx-str-06-testing-only-in-tests
  - id: NX-STR-07
    severity: error
    rule: Every module has `index.ts` and `server.ts`; `server.ts` may be empty. `conventions check` reports a module that lacks one.
    mechanism: check
    tool: module-complete
    since: 0.2.0
