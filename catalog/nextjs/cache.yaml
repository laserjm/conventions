# docs/nextjs/architecture.md — table "cache". Edit here; docs tables and rules/nextjs.yaml are generated.
group: cache
rules:
  - id: NX-CACHE-01
    severity: error
    rule: Caching primitives (`unstable_cache`, `"use cache"`, `cacheTag`) appear only in `queries.ts`; `revalidate*` appears only in `actions.ts`.
    mechanism: eslint
    tool: boundaries/external
  - id: NX-CACHE-02
    severity: error
    rule: "Tags are constants exported from `queries.ts` (`ORDER_TAGS = { all: 'orders', one: (id) => \\`order:${id}\\` }`). Tag strings are never typed inline."
    mechanism: ast-grep
    tool: nx-cache-02-no-inline-cache-tags
  - id: NX-CACHE-03
    severity: guidance
    rule: One `all` tag per aggregate for lists, one `one(id)` tag for detail views. Nothing finer until a measured need.
    mechanism: agent
    checklist: true
  - id: NX-CACHE-04
    severity: error
    rule: Revalidation happens in the action after the use case returns `ok`. Use cases and repositories never import `revalidate*`.
    mechanism: eslint
    tool: boundaries/external
  - id: NX-CACHE-05
    severity: error
    rule: A write that affects another module's reads calls that module's exported `revalidate<Noun>(id)` from its `index.ts`, never its tag strings.
    mechanism: ast-grep
    tool: nx-cache-05-no-foreign-tags
  - id: NX-CACHE-06
    severity: guidance
    rule: "`revalidatePath` only for routes without a natural aggregate."
    mechanism: agent
