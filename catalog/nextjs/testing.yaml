# docs/nextjs/testing.md — table "testing". Edit here; docs tables and rules/nextjs.yaml are generated.
group: testing
rules:
  - id: NX-TEST-01
    severity: error
    rule: "Every use case has a unit test next to it, run with in-memory fakes for its ports. No database, no Next. A thin use case may instead be covered by the module's command test, `commands.integration.test.ts` next to `commands.ts`, which calls it by its export name (`startThread`) against a real database with requesters it builds itself. Use cases with rules worth example tables (NX-TEST-06) keep their unit test."
    mechanism: check
    tool: use-case-test
  - id: NX-TEST-02
    severity: error
    rule: "Every repository has an integration test (`*.integration.test.ts`) against a real database: its own, or the module's command test when `commands.ts` imports it. A repository only `queries.ts` reaches has its own. For owned data (`isolation: tenant` or `owner`) the test proves another owner's rows can be neither read nor changed (NX-AUTH-03)."
    mechanism: check
    tool: repository-test
  - id: NX-TEST-03
    severity: error
    rule: "Integration tests run in the normal test command and use `describeIntegration()` from `@conventions/nextjs/testing`, which skips with a message when no local database stack is running. They never silently pass. A project that finds its stack its own way passes that check: `describeIntegration(name, fn, { when: localStack })`."
    mechanism: ast-grep
    tool: nx-test-03-integration-tests-skip-loudly
  - id: NX-TEST-04
    severity: guidance
    rule: Database code in categories A–E (NX-DB-02) has a database-level test; the binding names the tool.
    mechanism: agent
    checklist: true
  - id: NX-TEST-05
    severity: guidance
    rule: "Browser tests cover user goals, not components: one `tests/browser/<flow>.spec.ts` per critical flow."
    mechanism: agent
  - id: NX-TEST-06
    severity: guidance
    rule: "Domain functions are tested by example tables, not by mocking: `applyPayment` with a paid order returns `OrderAlreadyPaid`."
    mechanism: agent
    checklist: true
  - id: NX-TEST-07
    severity: error
    rule: Test files and `__fakes__/` are exempt from layer import rules but not from naming rules.
    mechanism: ast-grep
    tool: nx-str-06-testing-only-in-tests
    reportedAs: NX-STR-06
  - id: NX-TEST-08
    severity: guidance
    rule: "Test data comes from factories (`tests/factories/<noun>.ts`, `anOrder({ status: 'paid' })`), not from inline literals repeated across tests."
    mechanism: agent
