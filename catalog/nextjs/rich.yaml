# docs/nextjs/architecture.md — table "rich". Edit here; docs tables and rules/nextjs.yaml are generated.
group: rich
rules:
  - id: NX-RICH-01
    severity: error
    rule: "Anemic module shape: `contracts.ts` + `queries.ts` + `actions.ts` + `index.ts` + `server.ts` + `infra/<noun>.repository.ts`, no `domain/` and no `application/` until promotion. It may have a `commands.ts` for writes other modules' use cases call (NX-XMOD-01), each one repository call. A module whose `domain/` other modules judge with, and which has no `actions.ts` or `commands.ts`, is a read-only domain module and needs no `application/`."
    mechanism: check
    tool: rich-shape
  - id: NX-RICH-02
    severity: guidance
    rule: "Promotion: the moment an action contains an `if` about business state, or a second action needs the same calculation, extract a use case and a `domain/` file."
    mechanism: agent
    checklist: true
  - id: NX-RICH-03
    severity: error
    rule: '"Rich" means plain types and pure functions, not classes: `applyPayment(order, payment): Result<Order, OrderError>`.'
    mechanism: ast-grep
    tool: nx-rich-03-no-domain-classes
  - id: NX-RICH-04
    severity: guidance
    rule: Reads go `queries.ts → repository`. A read use case exists only when the read carries authorization or derivation logic (`can.*` flags).
    mechanism: agent
    checklist: true
