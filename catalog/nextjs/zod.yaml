# docs/nextjs/bindings/zod.md — table "zod". Edit here; docs tables and rules/nextjs.yaml are generated.
group: zod
rules:
  - id: NX-ZOD-01
    severity: error
    rule: "`zod` is imported in `contracts.ts`, `lib/env.ts`, `infra/` (external payloads, function results), `app/api/**` (webhooks) and `components/` (forms via resolver). Never in `domain/`; in `application/` only as `import type`."
    mechanism: eslint
    tool: boundaries/external
  - id: NX-ZOD-02
    severity: error
    rule: Every `z.*` schema declaration is `camelCase` + `Schema`; its type is `z.infer<typeof xSchema>` named `X` (NX-NAME-60).
    mechanism: ast-grep
    tool: nx-name-60-schema-suffix
    reportedAs: NX-NAME-60
  - id: NX-ZOD-03
    severity: guidance
    rule: "Branded ids: `orderIdSchema = z.string().transform(OrderId)` in `contracts.ts`; the `OrderId` constructor lives in `domain/order-id.ts`."
    mechanism: agent
    checklist: true
  - id: NX-ZOD-04
    severity: guidance
    rule: Forms use the action's input schema through `@hookform/resolvers/zod` (NX-TYPE-04). A separate `<noun>FormSchema` exists only when the form shape differs from the action input.
    mechanism: agent
    checklist: true
  - id: NX-ZOD-05
    severity: error
    rule: "`lib/env.ts` uses `@t3-oss/env-nextjs` or plain `z.object(...).parse(process.env)`; either way it is the only reader of `process.env` besides `lib/db/client.ts`. Tooling outside the app (`*.config.*`, `scripts/`) reads its own."
    mechanism: ast-grep
    tool: nx-zod-05-env-outside-env-readers
