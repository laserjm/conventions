# docs/nextjs/naming.md — table "naming-contracts". Edit here; docs tables and rules/nextjs.yaml are generated.
group: naming
rules:
  - id: NX-NAME-60
    severity: error
    rule: A contract schema is `camelCase` + `Schema`; its inferred type is the same name in `PascalCase` without the suffix.
    mechanism: ast-grep
    tool: nx-name-60-schema-suffix
  - id: NX-NAME-61
    severity: error
    rule: "`Dto` is the only suffix for shapes that cross the wire. `Payload`, `Request`, `Response`, `Data`, `Info` are not used. `Input` is for use case arguments. Domain types have no suffix."
    mechanism: ast-grep
    tool: nx-name-61-dto-suffix-only
    note: Checked in contracts.ts, where wire shapes live; a port or domain type may use a noun like Request.
  - id: NX-NAME-62
    severity: error
    rule: A tagged union's discriminant is always `_tag` and its value equals the type name.
    mechanism: eslint
    tool: nextjs/tag-matches-type-name
    reportedAs: NX-ERR-02
