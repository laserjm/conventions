name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the tag is the version
        run: |
          v="${GITHUB_REF_NAME#v}"
          test "$(node -p "require('./package.json').version")" = "$v" || { echo "package.json is not at $v"; exit 1; }
          grep -q "^## $v" CHANGELOG.md || { echo "CHANGELOG.md has no entry for $v"; exit 1; }
      - name: GitHub release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
