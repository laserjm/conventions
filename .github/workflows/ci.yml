name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: build the runtime package
        run: pnpm build
      - name: catalogue is valid and docs tables are in sync
        run: node scripts/build-catalog.mjs && git diff --exit-code rules/ docs/ packages/*/rules/
      - name: ESLint rule unit tests and ast-grep rule tests
        run: pnpm --filter @conventions/nextjs test
      - name: CLI tests
        run: pnpm --filter @conventions/cli test
      - name: reference module passes lint, check, tsc and its unit tests
        run: pnpm --filter @conventions/example-nextjs-orders test
      - name: every violation fixture fails for its rule ids; every lint-enforced rule has a fixture
        run: pnpm --filter @conventions/example-nextjs-violations test
      - name: packages pack
        run: pnpm --filter @conventions/nextjs pack --pack-destination /tmp && pnpm --filter @conventions/cli pack --pack-destination /tmp
